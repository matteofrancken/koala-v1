<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B4332">
    
    <!-- Apple PWA Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Koala AI">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="icon" type="image/png" href="/logo.png">
    
    <link rel="manifest" href="manifest.json">
    
    <title>Koala AI - Slimmer Communiceren</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
          --safe-area-inset-bottom: env(safe-area-inset-bottom);
          --safe-area-inset-top: env(safe-area-inset-top);
        }
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #F8F9FA; 
          color: #1C1C1C; 
          -webkit-tap-highlight-color: transparent;
          scroll-behavior: smooth;
          overscroll-behavior-y: none;
        }
        
        #root {
          padding-top: var(--safe-area-inset-top);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }

        .gradient-bg { background: linear-gradient(135deg, #2D6A4F 0%, #1B4332 100%); }
        .pb-safe { padding-bottom: var(--safe-area-inset-bottom); }
        
        ::-webkit-scrollbar {
          width: 5px;
          height: 5px;
        }
        ::-webkit-scrollbar-thumb {
          background: #2D6A4F;
          border-radius: 10px;
        }

        input, textarea, select {
          font-size: 16px !important;
        }

        .logo-shadow {
          filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "@stripe/stripe-js": "https://esm.sh/@stripe/stripe-js@^8.6.4",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.93.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- Vite zal deze import gebruiken om alle dependencies te bundelen voor optimale snelheid op mobiel -->
    <script type="module" src="/index.tsx"></script>
</body>
</html>
